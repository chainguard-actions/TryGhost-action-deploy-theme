name: Test basic deploy with theme options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://example.ghost.io'
          api-key: 'fake-api-key-for-testing'
          theme-name: 'my-test-theme'
          exclude: 'node_modules .git'
          working-directory: '.'
      - name: Assert action ran (expected to fail with API error)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the API URL/key are fake.
          # We just verify it ran and produced an outcome (failed or succeeded).
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
