name: Test basic deploy with theme-name, exclude, and working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: deploy
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://fake-ghost-site.example.com'
          api-key: '1234567890abcdef:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
          theme-name: 'my-custom-theme'
          exclude: '*.test.js node_modules'
          working-directory: '.'
      - name: Assert step ran (expected failure due to fake API)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with expected outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
