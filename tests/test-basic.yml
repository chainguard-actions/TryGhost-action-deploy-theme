name: Test basic deploy with theme-name and exclude
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy package.json for theme
        run: |
          echo '{"name":"test-theme","version":"1.0.0"}' > package.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://example.ghost.io'
          api-key: 'fake-api-key-for-testing-only'
          theme-name: 'my-test-theme'
          exclude: 'node_modules .git'
      - name: Assert action ran (may fail due to invalid API credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the API URL/key are fake.
          # We only verify that the action was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
