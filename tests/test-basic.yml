name: Test basic deploy with theme-name, exclude, and working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory with dummy theme files
        run: |
          mkdir -p my-theme/assets
          echo '{"name":"test-theme","version":"1.0.0"}' > my-theme/package.json
          echo '<html><body>Hello</body></html>' > my-theme/index.hbs

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://fake-ghost-site.example.com'
          api-key: '1234567890abcdef:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
          theme-name: 'my-custom-theme'
          exclude: 'node_modules .git'
          working-directory: 'my-theme'

      - name: Assert action ran (expected to fail due to fake API)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure due to fake API)"
