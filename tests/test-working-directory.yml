name: Test deployment with custom working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create theme in a subdirectory
        run: |
          mkdir -p theme-subdir
          echo '{"name":"subdir-theme","version":"1.0.0"}' > theme-subdir/package.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://invalid-ghost-site.example.com'
          api-key: '1234567890abcdef1234567890:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
          working-directory: 'theme-subdir'

      - name: Assert action ran with working-directory (failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid API credentials/URL, not because of missing inputs
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with working-directory (outcome=$OUTCOME)"
