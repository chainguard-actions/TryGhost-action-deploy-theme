name: Test deploy with working-directory option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a theme in a subdirectory
        run: |
          mkdir -p theme-subdir
          echo '{"name":"subdir-theme","version":"1.0.0"}' > theme-subdir/package.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://invalid-ghost-site.example.com'
          api-key: '1234567890abcdef1234567890:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
          working-directory: 'theme-subdir'

      - name: Assert action ran with working-directory (expected to fail with network/auth error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when using working-directory"
