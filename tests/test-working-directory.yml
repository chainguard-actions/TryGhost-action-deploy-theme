name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory with a package.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-theme"
          echo '{"name": "subdirectory-theme", "version": "1.0.0"}' > "$GITHUB_WORKSPACE/my-theme/package.json"
          echo "/* some css */" > "$GITHUB_WORKSPACE/my-theme/style.css"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'http://localhost:12345'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
          working-directory: 'my-theme'

      - name: Assert action failed at API stage (not at zip stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (API connection refused)"

      - name: Assert zip file was created in the working directory
        run: |
          echo "Listing files in my-theme directory:"
          ls -la "$GITHUB_WORKSPACE/my-theme/" 2>/dev/null || echo "Directory not found"
          if ls "$GITHUB_WORKSPACE/my-theme/"*.zip 2>/dev/null | grep -q '\.zip$'; then
            echo "PASS: a zip file was created in the working directory"
          else
            echo "FAIL: no zip file was found in my-theme/"
            exit 1
          fi
