name: Test invalid exclude pattern rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'http://localhost:12345'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
          exclude: '-rf /'

      - name: Assert action failed due to invalid exclude pattern
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid exclude pattern, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected option-like exclude pattern"
