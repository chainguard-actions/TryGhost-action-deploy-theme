name: Test invalid API URL error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal package.json for the theme
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-theme"
          echo '{"name":"my-test-theme","version":"1.0.0"}' > "$GITHUB_WORKSPACE/my-theme/package.json"
          echo 'body { color: red; }' > "$GITHUB_WORKSPACE/my-theme/style.css"

      - name: Run action with invalid API URL (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'http://localhost:19999'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef12345678901234567890abcdef123456'
          working-directory: 'my-theme'

      - name: Assert action failed due to invalid API URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API URL, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid API URL"
