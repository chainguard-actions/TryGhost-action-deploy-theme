name: Test custom theme name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal theme directory with package.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/custom-theme"
          # package.json has a different name than what we'll pass as theme-name
          echo '{"name":"default-theme-name","version":"1.0.0"}' > "$GITHUB_WORKSPACE/custom-theme/package.json"
          echo 'body { color: green; }' > "$GITHUB_WORKSPACE/custom-theme/style.css"
          echo "Theme directory created"
          ls -la "$GITHUB_WORKSPACE/custom-theme/"

      - name: Run action with custom theme name (expect failure at API call)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'http://localhost:19999'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef12345678901234567890abcdef123456'
          theme-name: 'my-custom-theme'
          working-directory: 'custom-theme'

      - name: Assert action failed at API call (not at zip creation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API URL is invalid (not because of zip issues)
          # This confirms the 'theme-name' input was accepted and the action proceeded to the API call
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at API call, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API call stage (custom theme name was accepted)"

      - name: Verify custom-named zip was created
        run: |
          echo "Checking for custom-named zip file..."
          ls -la "$GITHUB_WORKSPACE/custom-theme/" || true
          if [ -f "$GITHUB_WORKSPACE/custom-theme/my-custom-theme.zip" ]; then
            echo "PASS: custom-named zip file 'my-custom-theme.zip' was created"
          else
            echo "INFO: zip file not found at expected location (may have been cleaned up or named differently)"
            ls -la "$GITHUB_WORKSPACE/custom-theme/" || true
          fi
