name: Test custom theme-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'http://localhost:12345'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
          theme-name: 'custom-theme'

      - name: Assert action failed at API stage (not at zip stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (API connection refused)"

      - name: Assert custom-named zip file was created
        run: |
          echo "Listing zip files in workspace:"
          ls -la "$GITHUB_WORKSPACE"/*.zip 2>/dev/null || echo "No zip files found"
          if [ -f "$GITHUB_WORKSPACE/custom-theme.zip" ]; then
            echo "PASS: custom-theme.zip was created using the theme-name input"
          else
            echo "FAIL: custom-theme.zip was not found - custom theme-name was not used"
            exit 1
          fi
