name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install zip utility
        run: |
          if ! command -v zip &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq zip
          fi

      - name: Create a minimal package.json for the action to read
        run: |
          echo '{"name":"test-theme","version":"1.0.0"}' > "$GITHUB_WORKSPACE/package.json"

      - id: action
        uses: .
        with:
          api-url: 'http://localhost:12345'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
        continue-on-error: true

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
