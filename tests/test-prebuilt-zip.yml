name: Test deploy with pre-built zip file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal zip file to simulate a pre-built theme
        run: |
          mkdir -p /tmp/theme-build
          echo '{"name":"test-theme","version":"1.0.0"}' > /tmp/theme-build/package.json
          cd /tmp/theme-build
          zip -r /tmp/test-theme.zip .

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://invalid-ghost-site.example.com'
          api-key: '1234567890abcdef1234567890:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
          file: '/tmp/test-theme.zip'

      - name: Assert action ran with pre-built zip (expected to fail at upload stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at upload stage with invalid credentials"
