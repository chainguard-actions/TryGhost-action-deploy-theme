name: Test deploy with pre-built zip file and working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy zip file and working directory
        run: |
          mkdir -p my-theme
          echo '{"name":"test-theme","version":"1.0.0"}' > my-theme/package.json
          cd my-theme && zip -r ../my-theme.zip . && cd ..
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://example.ghost.io'
          api-key: 'fake-api-key-for-testing-only'
          file: 'my-theme.zip'
          working-directory: 'my-theme'
      - name: Assert action ran (may fail due to invalid API credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the API URL/key are fake.
          # We only verify that the action was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
