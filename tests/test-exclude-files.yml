name: Test exclude files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a theme directory with files to exclude
        run: |
          mkdir -p "$GITHUB_WORKSPACE/exclude-theme"
          echo '{"name":"exclude-test-theme","version":"1.0.0"}' > "$GITHUB_WORKSPACE/exclude-theme/package.json"
          echo 'body { color: purple; }' > "$GITHUB_WORKSPACE/exclude-theme/style.css"
          mkdir -p "$GITHUB_WORKSPACE/exclude-theme/tests"
          echo 'test content' > "$GITHUB_WORKSPACE/exclude-theme/tests/test.js"
          mkdir -p "$GITHUB_WORKSPACE/exclude-theme/.github"
          echo 'ci content' > "$GITHUB_WORKSPACE/exclude-theme/.github/workflow.yml"
          echo "Theme directory created with files to exclude"
          ls -la "$GITHUB_WORKSPACE/exclude-theme/"

      - name: Run action with exclude option (expect failure at API call)
        id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'http://localhost:19999'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef12345678901234567890abcdef123456'
          working-directory: 'exclude-theme'
          exclude: 'tests* .github*'

      - name: Assert action failed at API call (not at zip creation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API URL is invalid (not because of zip issues)
          # This confirms the 'exclude' input was accepted and the action proceeded to the API call
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at API call, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API call stage (exclude input was accepted)"

      - name: Verify zip was created and excluded files are not in it
        run: |
          echo "Checking for zip file..."
          ls -la "$GITHUB_WORKSPACE/exclude-theme/" || true
          ZIPFILE="$GITHUB_WORKSPACE/exclude-theme/exclude-test-theme.zip"
          if [ -f "$ZIPFILE" ]; then
            echo "Zip file found, checking contents..."
            unzip -l "$ZIPFILE"
            if unzip -l "$ZIPFILE" | grep -q "tests/test.js"; then
              echo "FAIL: excluded file 'tests/test.js' found in zip"
              exit 1
            fi
            echo "PASS: excluded files are not in the zip"
          else
            echo "INFO: zip file not found (may have been cleaned up)"
          fi
