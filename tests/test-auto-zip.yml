name: Test auto-zip from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'http://localhost:12345'
          api-key: '1234567890abcdef12345678:1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'

      - name: Assert action failed at API stage (not at zip stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (API connection refused after successful zip)"

      - name: Assert zip file was created (zip step succeeded)
        run: |
          echo "Listing zip files in workspace:"
          ls -la "$GITHUB_WORKSPACE"/*.zip 2>/dev/null || echo "No zip files found at workspace root"
          # The action reads package.json from the workspace root (action's own package.json)
          # which has name "action-deploy-theme", slugified to "action-deploy-theme"
          if ls "$GITHUB_WORKSPACE"/*.zip 2>/dev/null | grep -q '\.zip$'; then
            echo "PASS: a zip file was created successfully"
          else
            echo "FAIL: no zip file was created - auto-zip step failed"
            exit 1
          fi
