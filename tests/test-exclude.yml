name: Test deployment with exclude option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json and files to exclude
        run: |
          echo '{"name":"test-theme","version":"1.0.0"}' > package.json
          mkdir -p node_modules
          echo 'should be excluded' > node_modules/dummy.js
          echo 'should be excluded' > .git-keep

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-url: 'https://invalid-ghost-site.example.com'
          api-key: '1234567890abcdef1234567890:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab'
          exclude: 'node_modules .git-keep'

      - name: Assert action ran with exclude option (failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid API credentials/URL, not because of missing inputs
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with exclude option (outcome=$OUTCOME)"
